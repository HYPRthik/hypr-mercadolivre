<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mercado Livre × HYPR · Consolidado de Campanhas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Space+Mono:wght@400;700&family=Urbanist:wght@300;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ============================================================
   MERCADO LIVRE × HYPR — Consolidado de Campanhas
   Arquivo único. Sem build, sem backend, sem dependência de rede
   além das fontes e do Chart.js.
   Toda a UI é derivada do objeto DATA (ver <script> no fim).
   ============================================================ */
:root{
  --bg:#08080F; --bg2:#0E0E1A;
  --glass:rgba(255,255,255,.04); --glass2:rgba(255,255,255,.07); --glass3:rgba(255,255,255,.10);
  --bd:rgba(255,255,255,.08); --bd2:rgba(255,255,255,.14);
  --t:rgba(255,255,255,.92); --tm:rgba(255,255,255,.46); --tdim:rgba(255,255,255,.28);

  /* ---- Mercado Livre ---- */
  --ac:#FFE600;            /* amarelo institucional */
  --ac-l:#FFF25C;          /* amarelo suave (texto sobre fundo escuro) */
  --ac-d:#D9C400;
  --on-ac:#12121C;         /* tinta sobre superfície amarela */
  --ac-hover:rgba(255,230,0,.38); --ac-soft:rgba(255,230,0,.07); --ac-soft2:rgba(255,230,0,.14);
  --ac2:#7E8BF5;           /* azul ML clareado — dado "importante" */
  --blue:#2D3277;          /* azul institucional (superfícies/gradientes) */
  --blue-l:#4A54B8;

  --pos:#4FE3A0; --neg:rgba(255,255,255,.40);
  --grad-ac:linear-gradient(135deg,#FFE600,#FFC800);
  --grad-blue:linear-gradient(135deg,var(--blue-l),var(--blue));
  --blur:20px; --blur-s:12px;
  --maxw:1280px;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
h1,h2,h3{font-weight:inherit}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
img{display:block;max-width:100%}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--t);
  -webkit-font-smoothing:antialiased; line-height:1.5; overflow-x:hidden;}
.mono{font-family:'Space Mono',monospace}
.urb{font-family:'Urbanist',sans-serif}
a{color:inherit}

/* ---- fundo ambiente: blobs de cor + malha ---- */
body::before{content:'';position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(760px 520px at 82% -6%, rgba(255,230,0,.10), transparent 62%),
    radial-gradient(680px 560px at 8% 8%, rgba(45,50,119,.42), transparent 58%),
    radial-gradient(720px 620px at 50% 108%, rgba(74,84,184,.16), transparent 60%),
    var(--bg);}
body::after{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.045;
  background-image:linear-gradient(rgba(255,255,255,.6) 1px, transparent 1px),
                   linear-gradient(90deg, rgba(255,255,255,.6) 1px, transparent 1px);
  background-size:58px 58px;
  -webkit-mask-image:radial-gradient(72% 62% at 50% 12%, #000 0%, transparent 78%);
  mask-image:radial-gradient(72% 62% at 50% 12%, #000 0%, transparent 78%);}

/* ============ TOP BAR ============ */
.topbar{position:sticky;top:0;z-index:900;display:flex;align-items:center;justify-content:space-between;
  gap:16px;padding:13px 22px;background:rgba(8,8,15,.72);backdrop-filter:blur(var(--blur));
  border-bottom:1px solid var(--bd);}
.tb-l{display:flex;align-items:center;gap:13px;min-width:0;background:none;text-align:left}
.tb-sep{width:1px;height:20px;background:var(--bd2)}
.tb-x{font-family:'Space Mono',monospace;font-size:11px;color:var(--tm);letter-spacing:.5px}
.tb-hypr{height:15px;width:auto;opacity:.92}
.tb-tag{font-family:'Space Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:1px;
  color:var(--tm);border:1px solid var(--bd);border-radius:6px;padding:3px 8px;white-space:nowrap}
.tb-r{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tb-home{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tm);border:1px solid var(--bd);
  border-radius:8px;padding:6px 12px;transition:.2s;background:var(--glass)}
.tb-home:hover{color:var(--t);border-color:var(--ac-hover);background:var(--ac-soft)}

/* ---- marca Mercado Livre ----
   PROVISÓRIO: wordmark tipográfico enquanto o arquivo oficial da logo
   não chega. Trocar `BRAND.logo` no <script> por um data: URI e este
   bloco deixa de ser usado.                                          */
.mlmark{display:flex;align-items:center;gap:9px}
.mlmark-badge{width:30px;height:22px;border-radius:999px;background:var(--grad-ac);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  font-family:'Urbanist',sans-serif;font-weight:900;font-size:10px;letter-spacing:-.3px;color:var(--on-ac)}
.mlmark-word{font-family:'Urbanist',sans-serif;font-weight:700;font-size:15px;letter-spacing:-.4px;
  line-height:1;color:#fff;white-space:nowrap}
.mlmark.lg .mlmark-badge{width:74px;height:54px;font-size:24px;border-radius:999px}
.mlmark.lg .mlmark-word{font-size:38px;letter-spacing:-1.4px}
.tb-logo{height:26px;width:auto;filter:drop-shadow(0 1px 3px rgba(0,0,0,.4))}

/* ============ VIEWS ============ */
.view{display:none;animation:fade .4s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px}

/* ---- reveal on scroll (inspirado no one-pager HYPR × Monks) ---- */
.reveal{opacity:0;transform:translateY(22px);
  transition:opacity .75s var(--ease), transform .75s var(--ease)}
.reveal.in{opacity:1;transform:none}

/* ============ HUB ============ */
#hub.active{min-height:calc(100vh - 51px);display:flex;flex-direction:column}
.hub-hero{position:relative;padding:70px 22px 26px;display:flex;flex-direction:column;align-items:center;
  text-align:center;overflow:hidden}
.hero-blobs{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.blob{position:absolute;border-radius:50%;filter:blur(130px)}
.blob.b1{top:-320px;left:50%;transform:translateX(-50%);width:840px;height:840px;background:rgba(255,230,0,.16);
  animation:floatSlow 16s ease-in-out infinite}
.blob.b2{top:-40px;left:-220px;width:480px;height:480px;background:rgba(45,50,119,.55)}
.blob.b3{top:60px;right:-190px;width:520px;height:520px;background:rgba(74,84,184,.28)}
@keyframes floatSlow{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(26px)}}
.hub-hero > *:not(.hero-blobs){position:relative;z-index:1}

.eyebrow-chip{display:inline-flex;align-items:center;gap:9px;border-radius:999px;border:1px solid var(--bd2);
  background:var(--glass);padding:6px 16px;font-family:'Space Mono',monospace;font-size:10px;
  text-transform:uppercase;letter-spacing:2.2px;color:var(--t);margin-bottom:22px;
  opacity:0;animation:rise .7s .1s forwards}
.eyebrow-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--ac);
  box-shadow:0 0 10px rgba(255,230,0,.8);animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.32}}

.hub-title{font-family:'Urbanist',sans-serif;font-weight:300;letter-spacing:-1.8px;line-height:1.02;
  font-size:clamp(34px,6vw,74px);max-width:16ch;margin-bottom:16px;opacity:0;animation:rise .7s .2s forwards}
.hub-title em{font-style:normal;
  background:linear-gradient(120deg,var(--ac-l),var(--ac) 55%,#FFB800);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hub-sub{font-size:15.5px;color:var(--tm);max-width:56ch;line-height:1.65;opacity:0;animation:rise .7s .3s forwards}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

.stage{position:relative;width:100%;max-width:880px;margin:34px auto 6px;
  display:flex;align-items:center;justify-content:center;opacity:0;animation:rise .8s .38s forwards}
.stage-logo{position:relative;z-index:5;display:flex;flex-direction:column;align-items:center;gap:14px;
  padding:26px 44px}
.stage-logo img{height:96px;width:auto;filter:drop-shadow(0 0 34px rgba(255,230,0,.28)) drop-shadow(0 6px 18px rgba(0,0,0,.55))}
.stage-logo .x{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2.4px;color:var(--tm);text-transform:uppercase}

/* ---- marquee de capabilities ---- */
.marquee{position:relative;overflow:hidden;padding:28px 0 6px;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 16%,#000 84%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 16%,#000 84%,transparent)}
.marquee-track{display:flex;gap:44px;width:max-content;animation:marquee 38s linear infinite}
.marquee:hover .marquee-track{animation-play-state:paused}
.marquee-item{font-family:'Space Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:1.6px;
  color:var(--tdim);white-space:nowrap;display:flex;align-items:center;gap:44px}
.marquee-item::after{content:'';width:4px;height:4px;border-radius:50%;background:var(--ac);opacity:.45}
@keyframes marquee{to{transform:translateX(-50%)}}

/* big numbers */
.bignums{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:18px auto 6px;max-width:var(--maxw);}
.bn{min-width:0;background:var(--glass);border:1px solid var(--bd);border-radius:18px;padding:18px 16px;
  position:relative;overflow:hidden;transition:.25s;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.bn:hover{border-color:var(--ac-hover);background:var(--ac-soft);transform:translateY(-2px)}
.bn::before{content:'';position:absolute;top:0;left:0;width:100%;height:2px;
  background:var(--grad-ac);opacity:0;transition:.25s}
.bn:hover::before{opacity:1}
.bn-v{font-family:'Urbanist',sans-serif;font-weight:800;font-size:clamp(22px,2.4vw,30px);line-height:1;
  letter-spacing:-.5px;margin-bottom:6px}
.bn-v.pend{color:var(--tdim);font-weight:300}
.bn-l{font-size:12px;font-weight:600;color:var(--t);margin-bottom:3px}
.bn-s{font-size:10.5px;color:var(--tm);line-height:1.35}
@media(max-width:1080px){.bignums{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.bignums{grid-template-columns:repeat(2,1fr);gap:9px}.bn{padding:14px 13px}}

/* nav boxes */
.navsec{padding:38px 22px 54px;max-width:var(--maxw);margin:0 auto;width:100%}
.navsec-h{font-family:'Space Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:2px;
  color:var(--tm);margin-bottom:16px;display:flex;align-items:center;gap:10px}
.navsec-h::after{content:'';flex:1;height:1px;background:var(--bd)}
/* 6 cards → 3×2 em telas largas (auto-fit deixava um órfão na 2ª linha) */
.navgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:960px){.navgrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.navgrid{grid-template-columns:1fr}}
.navbox{text-align:left;background:var(--glass);border:1px solid var(--bd);border-radius:20px;
  padding:24px 22px;position:relative;overflow:hidden;transition:.28s var(--ease);min-height:178px;
  display:flex;flex-direction:column;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.navbox::after{content:'';position:absolute;top:-70px;right:-70px;width:190px;height:190px;border-radius:50%;
  background:var(--ac);opacity:0;filter:blur(70px);transition:opacity .45s}
.navbox:hover::after{opacity:.16}
.navbox:hover{border-color:var(--ac-hover);transform:translateY(-3px);
  box-shadow:0 18px 44px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.07)}
.navbox > *{position:relative;z-index:1}
.navbox-ic{width:42px;height:42px;border-radius:12px;background:var(--ac-soft2);border:1px solid var(--ac-hover);
  display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:16px;transition:.28s}
.navbox:hover .navbox-ic{background:var(--grad-ac);border-color:transparent}
.navbox-n{font-family:'Space Mono',monospace;font-size:10px;color:var(--ac);letter-spacing:1.5px;
  position:absolute;top:22px;right:22px;z-index:1}
.navbox-t{font-family:'Urbanist',sans-serif;font-weight:800;font-size:19px;letter-spacing:-.3px;margin-bottom:7px}
.navbox-d{font-size:12.5px;color:var(--tm);line-height:1.5;flex:1}
.navbox-go{font-size:12px;color:var(--ac);font-weight:600;margin-top:14px;display:flex;align-items:center;gap:6px;transition:.2s}
.navbox:hover .navbox-go{gap:11px}
.navbox-badge{position:absolute;bottom:22px;right:22px;font-family:'Space Mono',monospace;font-size:8.5px;
  text-transform:uppercase;letter-spacing:.8px;padding:3px 8px;border-radius:5px;
  background:var(--glass2);border:1px solid var(--bd);color:var(--tdim);z-index:1}

/* ============ SECTION SHELL ============ */
.sec-head{padding:32px 0 22px}
.sec-back{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--tm);margin-bottom:16px;
  border:1px solid var(--bd);border-radius:8px;padding:6px 13px;transition:.2s;background:var(--glass)}
.sec-back:hover{color:var(--t);border-color:var(--ac-hover);background:var(--ac-soft)}
.sec-eyebrow{font-family:'Space Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:2.4px;
  color:var(--ac);margin-bottom:10px}
.sec-title{font-family:'Urbanist',sans-serif;font-weight:300;font-size:clamp(28px,3.6vw,44px);
  letter-spacing:-1.2px;line-height:1.04;margin-bottom:10px}
.sec-title b{font-weight:800}
.sec-sub{font-size:14px;color:var(--tm);max-width:70ch;line-height:1.65}

/* cards / kpi */
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:13px;margin-bottom:14px}
.kcard{background:var(--glass);border:1px solid var(--bd);border-radius:17px;padding:18px;position:relative;
  overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.05);transition:.25s}
.kcard::after{content:'';position:absolute;top:-60px;right:-60px;width:150px;height:150px;border-radius:50%;
  background:var(--ac);opacity:0;filter:blur(60px);transition:opacity .4s}
.kcard:hover{border-color:var(--bd2)}
.kcard:hover::after{opacity:.10}
.kcard > *{position:relative;z-index:1}
.kcard.imp{border-color:rgba(255,230,0,.22)}
.kcard.imp .kc-v{color:var(--ac)}
.kcard.blue{border-color:rgba(126,139,245,.24)}
.kcard.blue .kc-v{color:var(--ac2)}
.kc-l{font-size:11px;color:var(--tm);margin-bottom:8px;font-weight:500;display:flex;align-items:center;gap:6px}
.kc-v{font-family:'Urbanist',sans-serif;font-weight:800;font-size:28px;line-height:1;letter-spacing:-.6px;margin-bottom:5px}
.kc-s{font-size:11px;color:var(--tm);line-height:1.4}
.kc-badge{font-family:'Space Mono',monospace;font-size:8.5px;text-transform:uppercase;letter-spacing:.6px;
  padding:2px 7px;border-radius:5px;background:var(--ac-soft2);color:var(--ac);border:1px solid var(--ac-hover)}

.panel{background:var(--glass);border:1px solid var(--bd);border-radius:20px;padding:22px 24px;margin-bottom:16px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.panel-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.panel-t{font-family:'Urbanist',sans-serif;font-weight:800;font-size:17px;letter-spacing:-.2px}
.panel-st{font-size:12px;color:var(--tm);margin-top:3px}

/* table */
.tbl-wrap{overflow-x:auto;border-radius:14px;border:1px solid var(--bd)}
table.dt{width:100%;border-collapse:collapse;font-size:12.5px;min-width:760px}
table.dt th{font-family:'Space Mono',monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.8px;
  color:var(--tm);text-align:right;padding:11px 13px;background:var(--glass2);border-bottom:1px solid var(--bd2);
  white-space:nowrap;position:sticky;top:0}
table.dt th.l,table.dt td.l{text-align:left}
table.dt td{padding:11px 13px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap;color:var(--t)}
table.dt tr:last-child td{border-bottom:none}
table.dt tbody tr{transition:.15s}
table.dt tbody tr:hover td{background:var(--glass)}
table.dt tr.tot td{font-weight:700;background:var(--ac-soft);border-top:2px solid var(--ac-hover);color:var(--t)}
table.dt tr.tot td.l{color:var(--ac)}
.cell-code{font-family:'Space Mono',monospace;font-size:11px;color:var(--ac)}
.cell-vert{font-size:10px;color:var(--tm);display:block}
.imp-col{color:var(--ac2)!important;font-weight:600}
.dash{color:var(--tdim)}
.chip{display:inline-block;font-family:'Space Mono',monospace;font-size:8.5px;text-transform:uppercase;
  letter-spacing:.5px;padding:2px 7px;border-radius:5px;background:var(--glass2);color:var(--tm);border:1px solid var(--bd)}
.chip.prelim{background:rgba(126,139,245,.14);color:var(--ac2);border-color:rgba(126,139,245,.32)}
.chip.vid{background:var(--ac-soft2);color:var(--ac);border-color:var(--ac-hover)}

/* notes */
.note{font-size:12.5px;color:var(--tm);background:var(--glass);border:1px solid var(--bd);border-left:3px solid var(--ac);
  border-radius:0 12px 12px 0;padding:14px 18px;line-height:1.65;margin-bottom:12px}
.note strong{color:var(--t)}
.note-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:760px){.note-grid{grid-template-columns:1fr}}

/* ---- estado vazio (V1: seções prontas aguardando dados) ---- */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  gap:11px;padding:60px 30px;border:1px dashed var(--bd2);border-radius:22px;background:var(--glass);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.empty-ic{width:56px;height:56px;border-radius:16px;background:var(--ac-soft);border:1px solid var(--ac-hover);
  display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:4px}
.empty-t{font-family:'Urbanist',sans-serif;font-weight:800;font-size:19px;letter-spacing:-.3px}
.empty-d{font-size:13px;color:var(--tm);max-width:52ch;line-height:1.6}
.empty-tag{font-family:'Space Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:1.4px;
  color:var(--ac);border:1px solid var(--ac-hover);background:var(--ac-soft);border-radius:6px;padding:4px 10px;margin-top:4px}

/* ============ CAMPANHAS ============ */
.campgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-bottom:30px}
.campbox{text-align:left;background:var(--glass);border:1px solid var(--bd);border-radius:20px;overflow:hidden;
  transition:.28s var(--ease);display:flex;flex-direction:column;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.campbox:hover{border-color:var(--ac-hover);transform:translateY(-3px);box-shadow:0 18px 40px rgba(0,0,0,.45)}
.campbox-top{position:relative;height:128px;overflow:hidden;background:#11111c}
.campbox-top img{width:100%;height:100%;object-fit:cover;opacity:.62;transition:.4s}
.campbox:hover .campbox-top img{opacity:.82;transform:scale(1.05)}
.campbox-top::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,8,15,.15),rgba(8,8,15,.92))}
/* capa-placeholder quando o flight ainda não tem criativo de imagem */
.campbox-top.ph{background:
  radial-gradient(120% 120% at 80% 0%, rgba(255,230,0,.22), transparent 60%),
  linear-gradient(150deg, rgba(45,50,119,.85), #101020);
  display:flex;align-items:center;justify-content:center}
.campbox-ph-txt{font-family:'Urbanist',sans-serif;font-weight:900;font-size:40px;letter-spacing:-2px;
  color:rgba(255,255,255,.14);text-transform:uppercase;user-select:none}
.campbox-vert{position:absolute;top:12px;left:12px;z-index:2;font-family:'Space Mono',monospace;font-size:9px;
  text-transform:uppercase;letter-spacing:1px;padding:3px 9px;border-radius:6px;
  background:rgba(8,8,15,.7);border:1px solid var(--bd2);color:var(--t)}
.campbox-code{position:absolute;top:12px;right:12px;z-index:2;font-family:'Space Mono',monospace;font-size:10px;
  color:var(--ac);background:rgba(8,8,15,.7);border:1px solid var(--ac-hover);padding:3px 8px;border-radius:6px}
.campbox-body{padding:16px 18px 18px;flex:1;display:flex;flex-direction:column}
.campbox-name{font-family:'Urbanist',sans-serif;font-weight:800;font-size:18px;letter-spacing:-.3px;margin-bottom:3px}
.campbox-per{font-size:11px;color:var(--tm);margin-bottom:13px;font-family:'Space Mono',monospace}
.campbox-mini{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:auto}
.cm{background:var(--glass2);border-radius:10px;padding:8px 10px}
.cm-v{font-family:'Urbanist',sans-serif;font-weight:800;font-size:15px;line-height:1}
.cm-l{font-size:9.5px;color:var(--tm);margin-top:3px}
.campbox-go{margin-top:13px;font-size:12px;color:var(--ac);font-weight:600;display:flex;align-items:center;gap:6px;transition:.2s}
.campbox:hover .campbox-go{gap:11px}

/* feature cards */
.det-feat{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.featcard{background:var(--glass2);border:1px solid var(--bd);border-radius:15px;padding:16px;transition:.2s}
.featcard:hover{border-color:var(--ac-hover)}
.featcard-n{font-family:'Space Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.8px;
  color:var(--ac);margin-bottom:10px}
.featcard-row{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px solid var(--bd)}
.featcard-row:last-of-type{border-bottom:none}
.featcard-row .k{color:var(--tm)}
.featcard-row .v{font-weight:600;font-family:'Urbanist',sans-serif}
.featcard-obs{font-size:10.5px;color:var(--tm);margin-top:9px;line-height:1.45;font-style:italic}

/* ---- timeline de flights (dentro do Consolidado) ---- */
.timeline{position:relative;padding:40px 16px 20px}
.tl-line{position:relative;height:4px;background:var(--bd2);border-radius:2px;margin:64px 10px 74px}
.tl-line::before{content:'';position:absolute;inset:0;border-radius:2px;
  background:linear-gradient(90deg,var(--blue-l),var(--ac))}
/* área de clique generosa (43px), marcador pequeno pintado no ::before —
   pintar o fundo do box com padding virava um círculo de 43px */
.tl-dot{position:absolute;top:50%;transform:translate(-50%,-50%);width:43px;height:43px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:5}
.tl-dot::before{content:'';width:13px;height:13px;border-radius:50%;background:var(--ac);
  border:2px solid var(--bg);box-shadow:0 0 0 2px var(--ac),0 0 14px rgba(255,230,0,.5);transition:.2s}
.tl-dot:hover::before,.tl-dot.active::before{box-shadow:0 0 0 3px var(--ac-l),0 0 22px rgba(255,230,0,.75);transform:scale(1.14)}
.tl-label{position:absolute;top:calc(100% + 12px);left:50%;transform:translateX(-50%);
  font-family:'Space Mono',monospace;font-size:9px;color:var(--tm);white-space:nowrap;text-align:center;line-height:1.4}
.tl-card{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);min-width:230px;background:var(--bg2);
  border:1px solid var(--ac-hover);border-radius:15px;padding:14px 16px;opacity:0;pointer-events:none;
  transition:opacity .15s;z-index:20;box-shadow:0 16px 40px rgba(0,0,0,.6)}
.tl-dot:hover .tl-card,.tl-dot.active .tl-card,.tl-card:hover{opacity:1!important;pointer-events:auto!important}
.tl-card-t{font-family:'Urbanist',sans-serif;font-weight:800;font-size:14px;margin-bottom:10px;color:var(--t)}
.tl-card-row{display:flex;justify-content:space-between;gap:16px;font-size:11px;padding:3px 0;border-bottom:1px solid var(--bd)}
.tl-card-row:last-of-type{border:none}
.tl-card-row .k{color:var(--tm)}
.tl-card-row .v{font-weight:600}
.tl-det-btn{display:block;width:100%;margin-top:10px;padding:7px;text-align:center;background:var(--ac-soft2);
  border:1px solid var(--ac-hover);border-radius:9px;font-size:11px;color:var(--ac);font-weight:600;transition:.2s}
.tl-det-btn:hover{background:var(--grad-ac);color:var(--on-ac);border-color:transparent}
.tl-detail{display:none;margin-top:16px;padding:18px;background:var(--glass);border:1px solid var(--bd);border-radius:16px}
.tl-detail.open{display:block}

/* ============ AUDIÊNCIAS ============ */
.audgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:13px;margin-bottom:18px}
.audcard{background:var(--glass);border:1px solid var(--bd);border-radius:17px;padding:17px 18px;transition:.24s;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.audcard:hover{border-color:var(--ac-hover);transform:translateY(-2px)}
.audcard-n{font-family:'Urbanist',sans-serif;font-weight:800;font-size:15px;letter-spacing:-.2px;margin-bottom:2px}
.audcard-c{font-size:10.5px;color:var(--tm);margin-bottom:12px;font-family:'Space Mono',monospace}
.audbar{height:6px;border-radius:3px;background:var(--glass3);overflow:hidden;margin:10px 0 8px}
.audbar > span{display:block;height:100%;border-radius:3px;background:var(--grad-ac)}
.audcard-row{display:flex;justify-content:space-between;font-size:12px;padding:3px 0}
.audcard-row .k{color:var(--tm)}
.audcard-row .v{font-weight:600;font-family:'Urbanist',sans-serif}

/* ============ CRIATIVOS ============ */
.filters{display:flex;flex-direction:column;gap:14px;margin-bottom:22px;background:var(--glass);
  border:1px solid var(--bd);border-radius:18px;padding:18px 20px;position:sticky;top:63px;z-index:50;
  backdrop-filter:blur(var(--blur))}
.filter-row{display:flex;flex-direction:column;gap:8px}
.filter-lbl{font-family:'Space Mono',monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:1px;color:var(--tm)}
.pills{display:flex;gap:7px;flex-wrap:wrap}
.pill{padding:6px 14px;border-radius:20px;border:1px solid var(--bd);background:var(--glass);color:var(--tm);
  font-size:11.5px;font-weight:500;transition:.18s;white-space:nowrap}
.pill:hover{border-color:var(--bd2);color:var(--t);background:var(--glass2)}
.pill.act{background:var(--ac-soft2);border-color:var(--ac-hover);color:var(--ac)}
.pill .ct{opacity:.6;margin-left:5px;font-family:'Space Mono',monospace;font-size:9.5px}
.cv-count{font-size:12px;color:var(--tm);margin-bottom:14px}
.cv-count b{color:var(--t);font-family:'Urbanist',sans-serif;font-weight:700}

.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;padding-bottom:40px}
.ccard{background:var(--glass);border:1px solid var(--bd);border-radius:16px;overflow:hidden;transition:.22s;
  display:flex;flex-direction:column;animation:fade .35s}
.ccard:hover{border-color:var(--ac-hover);transform:translateY(-3px);box-shadow:0 14px 32px rgba(0,0,0,.4)}
.ccard-media{position:relative;background:repeating-conic-gradient(#0e0e18 0% 25%, #12121e 0% 50%) 50%/18px 18px;
  display:flex;align-items:center;justify-content:center;min-height:150px;max-height:300px;overflow:hidden}
.ccard-media img{width:100%;height:auto;object-fit:contain;max-height:300px}
.ccard-media.tall img{max-height:340px;object-fit:cover;object-position:top}
.ccard-type{position:absolute;top:9px;left:9px;font-family:'Space Mono',monospace;font-size:8px;text-transform:uppercase;
  letter-spacing:.8px;padding:3px 7px;border-radius:5px;background:rgba(8,8,15,.78);border:1px solid var(--bd2);color:var(--t);z-index:2}
.ccard-type.vid{background:var(--ac-soft2);color:var(--ac);border-color:var(--ac-hover)}
.ccard-type.ifr{background:rgba(126,139,245,.16);color:var(--ac2);border-color:rgba(126,139,245,.32)}
.ccard-body{padding:11px 13px 13px}
.ccard-camp{font-size:12px;font-weight:600;color:var(--t);margin-bottom:3px;line-height:1.3}
.ccard-meta{font-family:'Space Mono',monospace;font-size:10px;color:var(--tm);display:flex;gap:8px;flex-wrap:wrap}
.ccard-meta .sz{color:var(--ac)}
.ccard-fmt{font-size:10px;color:var(--tm);margin-top:5px}

.media-lazy{position:relative;width:100%;min-height:170px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;background:linear-gradient(135deg,#15151f,#0d0d16)}
.media-lazy .play{width:52px;height:52px;border-radius:50%;background:var(--grad-ac);display:flex;align-items:center;
  justify-content:center;box-shadow:0 6px 24px rgba(255,230,0,.32);transition:.2s}
.media-lazy:hover .play{transform:scale(1.1)}
.media-lazy .play svg{width:20px;height:20px;margin-left:3px}
.media-lazy .hint{position:absolute;bottom:10px;font-size:10px;color:var(--tm);font-family:'Space Mono',monospace}
.media-frame{width:100%;border:none;display:block;background:#000}

/* ============ MATERIAIS ============ */
.matgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.matcard{background:var(--glass);border:1px solid var(--bd);border-radius:17px;transition:.22s;text-align:left;
  padding:0;overflow:hidden;display:flex;flex-direction:column}
.matcard:hover{border-color:var(--ac-hover);transform:translateY(-3px)}
.matcard-thumb{height:160px;overflow:hidden;background:#11111c;position:relative;flex-shrink:0}
.matcard-thumb img{width:100%;height:100%;object-fit:cover;object-position:top}
.matcard-thumb::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,transparent 50%,rgba(8,8,15,.7))}
.matcard-tag{position:absolute;top:10px;left:10px;z-index:2;font-family:'Space Mono',monospace;font-size:8px;
  text-transform:uppercase;letter-spacing:.8px;padding:3px 8px;border-radius:5px;
  background:rgba(8,8,15,.75);border:1px solid var(--bd2);color:var(--tm)}
.matcard-body{padding:14px 16px 16px;flex:1;display:flex;flex-direction:column}
.matcard-t{font-family:'Urbanist',sans-serif;font-weight:700;font-size:13.5px;margin-bottom:12px;line-height:1.35;flex:1}
.matcard-btn{display:block;padding:8px;text-align:center;background:var(--ac-soft2);border:1px solid var(--ac-hover);
  border-radius:9px;font-size:11px;color:var(--ac);font-weight:600;text-decoration:none;transition:.2s}
.matcard-btn:hover{background:var(--grad-ac);color:var(--on-ac);border-color:transparent}

/* ============ BRAND-LIFT ============ */
.bl-controls{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:18px;align-items:flex-end}
.bl-cg{display:flex;flex-direction:column;gap:7px}
.bl-cg .filter-lbl{margin:0}
.chartwrap{position:relative;width:100%;height:360px}
.bl-legend{display:flex;gap:16px;flex-wrap:wrap}
.bl-leg{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--tm)}
.bl-leg .dot{width:9px;height:9px;border-radius:50%}
.bl-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:16px}
.blc{background:var(--glass);border:1px solid var(--bd);border-radius:15px;padding:15px 17px}
.blc-w{font-family:'Space Mono',monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:1px;color:var(--tm);margin-bottom:5px}
.blc-camp{font-size:11px;color:var(--tm);margin-bottom:9px}
.blc-v{font-family:'Urbanist',sans-serif;font-weight:800;font-size:26px;line-height:1;margin-bottom:3px}
.blc-v.pos{color:var(--pos)} .blc-v.neg{color:var(--neg)}
.blc-r{font-size:11px;color:var(--tm)}
.blc-n{font-size:10px;color:var(--tdim);margin-top:5px}

/* footer */
.foot{text-align:center;padding:34px 22px 44px;font-size:11px;color:var(--tdim);
  border-top:1px solid var(--bd);margin-top:20px;font-family:'Space Mono',monospace;line-height:1.8}
.foot b{color:var(--tm)}

/* mobile */
@media(max-width:760px){.stage-logo img{height:56px}.stage-logo{padding:14px 20px}}
@media(max-width:560px){
  .topbar{padding:11px 14px;gap:8px}
  .tb-tag,.tb-x,.tb-sep{display:none}
  .mlmark-word{font-size:13px}
  .filters{top:55px}
  .hub-hero{padding:44px 18px 20px}
}
.hide{display:none!important}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

const fmtInt  = n => (n==null||isNaN(n)) ? "—" : Math.round(n).toLocaleString("pt-BR");
const fmtBRL  = n => (n==null||isNaN(n)) ? "—" : "R$ " + n.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtBRL0 = n => (n==null||isNaN(n)) ? "—" : "R$ " + n.toLocaleString("pt-BR",{maximumFractionDigits:0});
const fmtPct  = (n,d=2) => (n==null||isNaN(n)) ? "—" : (n*100).toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d}) + "%";
const fmtMi   = n => (n==null||isNaN(n)) ? "—" : (n>=1e6
                  ? (n/1e6).toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1}) + " mi"
                  : (n>=1e3 ? Math.round(n/1e3).toLocaleString("pt-BR") + " mil" : fmtInt(n)));
const fmtBRLc = n => (n==null||isNaN(n)) ? "—" : (n>=1e6
                  ? "R$ " + (n/1e6).toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1}) + " mi"
                  : (n>=1e3 ? "R$ " + Math.round(n/1e3).toLocaleString("pt-BR") + " mil" : fmtBRL0(n)));
const dash    = () => '<span class="dash">—</span>';
const plural  = (n,s,p) => n===1 ? `1 ${s}` : `${n} ${p}`;
const esc     = s => String(s==null?"":s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ============================================================
   4. CONSOLIDAÇÃO
   Regra: soma direta enquanto a base parte do zero; assim que
   DATA.totals tiver valores, eles vencem (base ancorada).
   Taxas nunca são média de médias — derivam do custo efetivo.
   ============================================================ */
function computeTotals(){
  const F = DATA.flights, stored = DATA.totals || {};
  if(!F.length) return Object.assign({}, stored);
  const sum = k => F.reduce((a,f)=>a + (Number(f[k]) || 0), 0);

  const t = {
    budget:     sum('budget'),
    custo_over: sum('custo_over'),
    impr:       sum('impr'),
    clicks:     sum('clicks'),
  };
  /* Custo efetivo do portfólio. Usa o valor informado no resumo quando
     existe (`custo_ef`) — derivar de cpm_ef × impr introduz o erro do
     arredondamento do CPM na 2ª casa. */
  const custoEf = f => (f.custo_ef != null)
    ? Number(f.custo_ef)
    : (Number(f.cpm_ef)||0) * (Number(f.impr)||0) / 1000;
  const E = F.reduce((a,f)=>a + custoEf(f), 0);
  t.custo_ef = E;
  /* precisão cheia aqui; só a exibição arredonda. Derivar a rentabilidade
     do CPM já arredondado em 2 casas dava 22,99% onde o resumo diz 22,97% */
  t.cpm_ef = t.impr ? E / t.impr * 1000 : null;
  t.ctr    = t.impr ? t.clicks / t.impr : null;
  t.cpc    = t.clicks ? E / t.clicks : null;
  t.rentab = (CFG.cpmNegPadrao && t.cpm_ef!=null)
    ? (CFG.cpmNegPadrao - t.cpm_ef) / CFG.cpmNegPadrao : null;

  const V = F.filter(f=>f.video);
  if(V.length){
    const sv = V.reduce((a,f)=>a + (Number(f.v_startviews)||0), 0);
    t.v_views   = V.reduce((a,f)=>a + (Number(f.v_views)||0), 0);
    t.v_clicks  = V.reduce((a,f)=>a + (Number(f.v_clicks)||0), 0);
    t.v_budget  = V.reduce((a,f)=>a + (Number(f.v_budget)||0), 0);
    t.v_vtr     = sv ? t.v_views / sv : null;
    /* CPCV consolidado ponderado por views completos */
    t.v_cpcv_ef = t.v_views
      ? V.reduce((a,f)=>a + (Number(f.v_cpcv_ef)||0) * (Number(f.v_views)||0), 0) / t.v_views
      : null;
    t.rentab_cpcv = (CFG.cpcvNegPadrao && t.v_cpcv_ef!=null)
      ? (CFG.cpcvNegPadrao - t.v_cpcv_ef) / CFG.cpcvNegPadrao : null;
  }
  t.investido_cliente = t.budget + (CFG.videoBudgetSeparado ? (t.v_budget||0) : 0);

  return Object.assign(t, stored);   /* valores gravados vencem o cálculo */
}

function initReveal(){
  const els = document.querySelectorAll('.reveal:not(.in)');
  if(!els.length) return;
  if(!('IntersectionObserver' in window)){ els.forEach(e=>e.classList.add('in')); return; }
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); } });
  }, {rootMargin:'160px 0px 220px 0px', threshold:0});
  els.forEach(e=>io.observe(e));
  /* rede de segurança: nada pode ficar invisível para sempre se o
     observer não disparar (view oculta, impressão, motor sem suporte) */
  clearTimeout(initReveal._t);
  initReveal._t = setTimeout(()=>{
    document.querySelectorAll('.view.active .reveal:not(.in)').forEach(e=>{
      const r = e.getBoundingClientRect();
      if(r.top < window.innerHeight + 400) e.classList.add('in');
    });
  }, 900);
}

  const dots = F.map((f,i)=>{
    const pct = total > 0 ? (i/total)*100 : 50;
    return `<div class="tl-dot" style="left:${pct}%" data-tl="${esc(f.code)}">
      <div class="tl-card" style="bottom:calc(100% + 4px);top:auto">
        <div class="tl-card-t">${esc(f.camp)}</div>
        <div class="tl-card-row"><span class="k">Mês</span><span class="v">${esc(f.mes)}</span></div>
        <div class="tl-card-row"><span class="k">Budget</span><span class="v">${fmtBRL0(f.budget)}</span></div>
        <div class="tl-card-row"><span class="k">Impressões</span><span class="v">${fmtMi(f.impr)}</span></div>
        <div class="tl-card-row"><span class="k">Cliques</span><span class="v">${fmtInt(f.clicks)}</span></div>
        <div class="tl-card-row"><span class="k">CTR</span><span class="v">${fmtPct(f.ctr)}</span></div>
        <button class="tl-det-btn" onclick="toggleTlDetail('${esc(f.code)}')">Ver detalhes</button>
      </div>
      <span class="tl-label">${esc(f.mes)}<br>${esc(f.code)}</span>
    </div>`;
  }).join('');

  const details = F.map(f=>{
    const feats = DATA.features.filter(ft=>String(ft.code).includes(f.code));
    const cre   = DATA.creatives.filter(c=>c.camp===f.creativeCamp && c.type==='image').slice(0,4);
    const featHtml = feats.length
      ? feats.map(ft=>`<div style="font-size:11px;padding:6px 0;border-bottom:1px solid var(--bd)"><b style="color:var(--ac)">${esc(ft.feat)}</b>${ft.clicks!=null?' · '+fmtInt(ft.clicks)+' cliques':''}</div>`).join('')
      : '<span style="font-size:11px;color:var(--tm)">—</span>';
    const creHtml = cre.length
      ? `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-top:8px">${cre.map(c=>`<img src="${c.src}" style="width:100%;border-radius:7px;border:1px solid var(--bd)" alt="">`).join('')}</div>`
      : '';
    return `<div class="tl-detail" id="tld-${esc(f.code)}">
      <div class="panel-t" style="margin-bottom:12px">${esc(f.camp)} · ${esc(f.mes)}</div>
      <div class="kgrid" style="grid-template-columns:repeat(auto-fill,minmax(140px,1fr))">
        <div class="kcard"><div class="kc-l">Impressões</div><div class="kc-v urb" style="font-size:20px">${fmtMi(f.impr)}</div></div>
        <div class="kcard"><div class="kc-l">Cliques</div><div class="kc-v urb" style="font-size:20px">${fmtInt(f.clicks)}</div></div>
        <div class="kcard"><div class="kc-l">CTR</div><div class="kc-v urb" style="font-size:20px">${fmtPct(f.ctr)}</div></div>
        <div class="kcard"><div class="kc-l">CPC</div><div class="kc-v urb" style="font-size:20px">${fmtBRL(f.cpc)}</div></div>
        <div class="kcard"><div class="kc-l">CPM efetivo</div><div class="kc-v urb" style="font-size:20px">${fmtBRL(f.cpm_ef)}</div></div>
        <div class="kcard imp"><div class="kc-l">Budget</div><div class="kc-v urb" style="font-size:20px">${fmtBRL0(f.budget)}</div></div>
        ${f.video?`<div class="kcard imp"><div class="kc-l">Views 100%</div><div class="kc-v urb" style="font-size:20px">${fmtInt(f.v_views)}</div></div>
        <div class="kcard"><div class="kc-l">VTR</div><div class="kc-v urb" style="font-size:20px">${fmtPct(f.v_vtr)}</div></div>`:''}
      </div>
      ${feats.length?`<div style="margin-top:14px"><div class="filter-lbl" style="margin-bottom:8px">Features ativadas</div>${featHtml}</div>`:''}
      ${cre.length?`<div style="margin-top:14px"><div class="filter-lbl" style="margin-bottom:8px">Preview de criativos</div>${creHtml}</div>`:''}
    </div>`;
  }).join('');

  return `<div class="timeline"><div class="tl-line">${dots}</div></div>${details}`;
}
function toggleTlDetail(code){
  document.querySelectorAll('.tl-detail').forEach(el=>{
    if(el.id==='tld-'+code) el.classList.toggle('open');
    else el.classList.remove('open');
  });
}

const FEAT_DISPLAY = { 'Tap-to-Map / Tap-to-Go':'Tap-to-Go' };

function buildFeatCards(){
  const map = {};
  DATA.features.forEach(f=>{
    const key = f.feat;
    if(!map[key]) map[key] = {feat:key, camps:[], vi:0, clicks:0, ctr_sum:0, ctr_n:0, plays:0};
    map[key].camps.push(f.camp);
    if(f.vi)     map[key].vi     += f.vi;
    if(f.clicks) map[key].clicks += f.clicks;
    if(f.ctr){   map[key].ctr_sum += f.ctr; map[key].ctr_n++; }
    if(f.plays)  map[key].plays  += f.plays;
    if(f.feat==='Survey') map[key].isSurvey = true;
  });
  return Object.values(map).map(g=>{
    const campSet = [...new Set(g.camps)];
    const surveyBtn = g.isSurvey
      ? `<button class="matcard-btn" style="margin-top:10px;width:100%" onclick="go('brandlift')">Ver resultados de Survey →</button>` : '';
    return `<div class="featcard reveal" style="padding:18px;display:flex;flex-direction:column">
      <div style="font-size:14px;font-weight:700;color:var(--t);margin-bottom:6px;line-height:1.2">${esc(FEAT_DISPLAY[g.feat]||g.feat)}</div>
      <div style="font-size:12px;color:var(--ac);font-weight:600;margin-bottom:10px">${plural(campSet.length,'campanha','campanhas')}</div>
      ${g.vi?`<div class="featcard-row"><span class="k">Impressões</span><span class="v">${fmtInt(g.vi)}</span></div>`:''}
      ${g.clicks?`<div class="featcard-row"><span class="k">Cliques</span><span class="v">${fmtInt(g.clicks)}</span></div>`:''}
      ${g.ctr_n?`<div class="featcard-row"><span class="k">CTR</span><span class="v">${fmtPct(g.ctr_sum/g.ctr_n)}</span></div>`:''}
      ${g.plays?`<div class="featcard-row"><span class="k">Plays PDOOH</span><span class="v">${fmtInt(g.plays)}</span></div>`:''}
      ${surveyBtn}
    </div>`;
  }).join('');
}

  /* a linha do tempo só comunica com 2+ flights; com um só vira um ponto

  <div class="panel reveal">
    <div class="panel-h"><div><div class="panel-t">Desempenho por flight</div>

    ${buildTimeline(F)}

  return head + kg + timeline + `

    <div class="tbl-wrap"><table class="dt">
      <thead><tr><th class="l">Campanha</th><th>${CFG.codeLabel}</th><th>Budget</th><th>Impressões</th>

function firstCreativeFor(creativeCamp){
  const list = DATA.creatives.filter(c=>c.camp===creativeCamp && c.type==="image");
  const pref = list.find(c=>c.size==="970x250") || list.find(c=>c.size==="728x90")
    || list.find(c=>c.size==="300x250") || list.find(c=>c.size==="1200x628") || list[0];
  return pref ? pref.src : null;
}
function coverInitials(name){
  const s = String(name||'').trim();
  if(s.length <= 4) return s;   /* nomes curtos como "7.7" e "8.8" cabem inteiros */
  return s.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('');
}
function buildCampBox(f){
  const cover = firstCreativeFor(f.creativeCamp);
  const nCre  = DATA.creatives.filter(c=>c.camp===f.creativeCamp).length;
  const nFeat = DATA.features.filter(ft=>String(ft.code).includes(f.code)).length;
  return `<button class="campbox reveal" data-flight="${esc(f.code)}">
    <div class="campbox-top${cover?'':' ph'}">
      ${cover?`<img src="${cover}" alt="">`:`<span class="campbox-ph-txt">${esc(coverInitials(f.camp))}</span>`}
      <span class="campbox-vert">${esc(f.vert)}</span>
      <span class="campbox-code">${esc(f.code)}</span>
    </div>
    <div class="campbox-body">
      <div class="campbox-name">${esc(f.camp)}${f.prelim?'<span class="chip prelim" style="margin-left:6px">preliminar</span>':''}</div>
      <div class="campbox-per">${esc(f.mes)} · ${esc(f.periodo)}</div>
      <div class="campbox-mini">
        <div class="cm"><div class="cm-v urb">${fmtMi(f.impr)}</div><div class="cm-l">impressões</div></div>
        <div class="cm"><div class="cm-v urb">${fmtInt(f.clicks)}</div><div class="cm-l">cliques</div></div>
        <div class="cm"><div class="cm-v urb">${nCre||'—'}</div><div class="cm-l">criativos</div></div>

function buildFlightDetail(code){
  const f = DATA.flights.find(x=>x.code===code);
  if(!f) return buildCampanhasHub();
  const cre   = DATA.creatives.filter(c=>c.camp===f.creativeCamp);
  const feats = DATA.features.filter(ft=>String(ft.code).includes(code));
  const auds  = DATA.audiences.filter(a=>String(a.code).includes(code));

  const kpis = [
    {l:"Impressões visíveis", v:fmtInt(f.impr), imp:1},
    {l:"Cliques", v:fmtInt(f.clicks)},
    {l:"CTR", v:fmtPct(f.ctr)},
    {l:"CPC", v:fmtBRL(f.cpc)},
    {l:"CPM efetivo", v:fmtBRL(f.cpm_ef)},
    {l:"Budget contratado", v:fmtBRL0(f.budget), imp:1},
  ];
  if(f.rentab!=null) kpis.push({l:"Rentabilidade CPM", v:fmtPct(f.rentab,2)});
  /* métricas de entrega do bloco OTHER METRICS do resumo */
  if(f.pacing!=null)     kpis.push({l:"Pacing de entrega", v:fmtPct(f.pacing,1),
                                    s: f.impr_neg!=null ? `${fmtMi(f.impr_neg)} negociadas` : ''});
  if(f.alcance!=null)    kpis.push({l:"Alcance (D-1)", v:fmtMi(f.alcance), blue:1});
  if(f.frequencia!=null) kpis.push({l:"Frequência (D-1)", v:f.frequencia.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}), blue:1});
  if(f.video){
    kpis.push({l:"Budget de vídeo", v:fmtBRL(f.v_budget), imp:1});
    kpis.push({l:"Views completos (vídeo)", v:fmtInt(f.v_views), imp:1});
    kpis.push({l:"VTR (vídeo)", v:fmtPct(f.v_vtr)});
    kpis.push({l:"CPCV efetivo", v:fmtBRL(f.v_cpcv_ef)});
    if(f.v_rentab_cpcv!=null)
      kpis.push({l:"Rentabilidade CPCV", v:fmtPct(f.v_rentab_cpcv,2),
                 s:`vs. ${fmtBRL(f.v_cpcv_neg)} contratado`});
  }
  const kg = kpis.map((k,i)=>`<div class="kcard reveal ${k.imp?'imp':''}${k.blue?' blue':''}" style="transition-delay:${i*40}ms">
    <div class="kc-l">${k.l}</div><div class="kc-v urb">${k.v}</div>
    ${k.s?`<div class="kc-s">${k.s}</div>`:''}</div>`).join('');

  const featHtml = feats.length ? feats.map(ft=>{
    let rows = "";
    if(ft.vi!=null)     rows += `<div class="featcard-row"><span class="k">Impr. visíveis</span><span class="v">${fmtInt(ft.vi)}</span></div>`;
    if(ft.clicks!=null) rows += `<div class="featcard-row"><span class="k">Cliques</span><span class="v">${fmtInt(ft.clicks)}</span></div>`;
    if(ft.ctr!=null)    rows += `<div class="featcard-row"><span class="k">CTR</span><span class="v">${fmtPct(ft.ctr)}</span></div>`;
    if(ft.plays!=null)  rows += `<div class="featcard-row"><span class="k">Plays (PDOOH)</span><span class="v">${fmtInt(ft.plays)}</span></div>`;
    return `<div class="featcard"><div class="featcard-n">${esc(ft.feat)}</div>${rows}
      ${ft.obs?`<div class="featcard-obs">${esc(ft.obs)}</div>`:''}</div>`;
  }).join('') : `<div class="note">Nenhuma feature registrada para este flight.</div>`;

  const creHtml = cre.length
    ? `<div class="cgrid">${cre.map(renderCreativeCard).join('')}</div>`
    : `<div class="note">Sem criativos catalogados para este flight.</div>`;

  const audHtml = auds.length
    ? `<div class="panel reveal"><div class="panel-h"><div><div class="panel-t">Audiências</div>
        <div class="panel-st">${plural(auds.length,'segmento','segmentos')} neste flight</div></div></div>
        ${audTable(auds)}</div>` : '';

  return secHead({
      back:'campanhas', backLabel:'Todas as campanhas',
      eyebrow: esc(f.vert),
      title: esc(f.camp),
      sub: `<span class="cell-code" style="font-size:13px">${esc(f.code)}</span> · ${esc(f.mes)} · ${esc(f.periodo)}`
    }) + `
  <div class="kgrid">${kg}</div>
  ${f.prelim?`<div class="note"><strong>Campanha em curso.</strong> Os dados de ${esc(f.camp)} (${esc(f.periodo)}) são preliminares — o fechamento ainda não ocorreu.</div>`:''}
  <div class="panel reveal">
    <div class="panel-h"><div><div class="panel-t">Features ativadas</div></div></div>
    <div class="det-feat">${featHtml}</div>
  </div>
  ${audHtml}
  <div class="panel reveal">
    <div class="panel-h"><div><div class="panel-t">Criativos veiculados</div>
      <div class="panel-st">${plural(cre.length,'peça nesta campanha','peças nesta campanha')}</div></div></div>
    ${creHtml}
  </div>`;
}

let audFilter = 'all';
function audTable(A){
  const temVtr   = A.some(a=>a.vtr!=null);
  const temCusto = A.some(a=>a.custo_ef!=null);
  const sum = k => A.reduce((s,a)=>s + (Number(a[k])||0), 0);
  const tVi = sum('vi'), tClicks = sum('clicks'), tCusto = sum('custo_ef');
  /* linha de total: os segmentos do resumo do ML particionam a entrega,
     então o rodapé serve de conferência — deve fechar com o flight */
  const totRow = A.length > 1 ? `<tr class="tot">
      <td class="l">TOTAL — ${plural(A.length,'segmento','segmentos')}</td>
      <td><span class="cell-code">—</span></td>
      <td>${fmtInt(tVi)}</td>
      <td>${fmtInt(tClicks)}</td>
      <td>${tVi?fmtPct(tClicks/tVi):dash()}</td>
      ${temCusto?`<td>${fmtBRL0(tCusto)}</td>`:''}
      ${temVtr?`<td>${dash()}</td>`:''}</tr>` : '';

          <div class="urb" style="font-weight:800;font-size:16px;color:var(--ac)">${w.nExp}</div>

      <div class="panel-st">Diferença percentual (exposto − controle), em pontos percentuais</div></div>

        <div class="bl-leg"><span class="dot" style="background:rgba(255,255,255,.3)"></span>Controle</div>
      </div></div>
    <div class="chartwrap"><canvas id="blCanvas"></canvas></div>
  </div>
  <div class="bl-cards">${cards}</div>
  <div class="note" style="margin-top:24px"><strong>Metodologia:</strong> o brand-lift mede a diferença na taxa de resposta entre o grupo exposto e o controle. Valores positivos indicam ganho a favor do grupo exposto.</div>`;

function renderBLChart(){
  const canvas = document.getElementById("blCanvas");
  if(!canvas || typeof Chart === "undefined" || !DATA.brandlift.length) return;
  const BL = blState.wave==="all" ? DATA.brandlift : DATA.brandlift.filter(w=>w.code===blState.wave);
  if(!BL.length) return;
  let labels=[], exp=[], ctrl=[];
  const title = document.getElementById("blTitle");
  if(BL.length===1){
    const w = BL[0];
    w.rows.forEach(r=>{ labels.push(r.r); exp.push(+(r.exp*100).toFixed(1)); ctrl.push(+(r.ctrl*100).toFixed(1)); });
    if(title) title.textContent = `${w.wave} · ${w.camp} — exposto vs. controle (% por resposta)`;
  } else {
    BL.forEach(w=>{
      const h = w.rows.find(r=>r.r==="Sim"||r.r==="Muito provável") || w.rows[0];
      labels.push(`${w.wave}\n${h.r}`); exp.push(+(h.exp*100).toFixed(1)); ctrl.push(+(h.ctrl*100).toFixed(1));
    });
    if(title) title.textContent = "Resposta positiva por onda — exposto vs. controle (%)";
  }
  if(blChart) blChart.destroy();
  blChart = new Chart(canvas.getContext("2d"), {
    type:"bar",
    data:{labels,datasets:[
      {label:"Exposto",  data:exp,  backgroundColor:"#FFE600", borderRadius:6, maxBarThickness:46},
      {label:"Controle", data:ctrl, backgroundColor:"rgba(255,255,255,.22)", borderRadius:6, maxBarThickness:46},
    ]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},
        tooltip:{callbacks:{label:c=>c.dataset.label+": "+c.parsed.y.toLocaleString("pt-BR",{minimumFractionDigits:1})+"%"}}},
      scales:{
        x:{ticks:{color:"rgba(255,255,255,.55)",font:{family:"DM Sans",size:11},
            callback:function(v){return this.getLabelForValue(v).split("\n");}}, grid:{display:false}},
        y:{ticks:{color:"rgba(255,255,255,.4)",font:{family:"Space Mono",size:10},callback:v=>v+"%"},
           grid:{color:"rgba(255,255,255,.06)"},beginAtZero:true}}}
  });
}

let matFilter = 'all';
function matDateOrder(title){
  const months={jan:1,fev:2,mar:3,abr:4,mai:5,jun:6,jul:7,ago:8,set:9,out:10,nov:11,dez:12};
  const m = String(title).toLowerCase().match(/\/?(jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)\/?(\d{2})/);
  if(!m) return 0;
  return (parseInt(m[2],10)+2000)*100 + (months[m[1]]||0);
}
function renderMatGrid(){
  const grid = document.getElementById('matGrid');
  if(!grid) return;
  const cats = DATA.materiais.filter(c=>matFilter==='all' || c.id===matFilter);
  let items = [];
  cats.forEach(cat=>cat.items.forEach(item=>items.push({cat,item})));
  items.sort((a,b)=>matDateOrder(b.item.title)-matDateOrder(a.item.title));
  grid.innerHTML = items.map(({cat,item})=>{
    /* pós-venda em PDF abre pelo visualizador do Drive; Slides, pelo editor */
    const pdf = item.kind === 'pdf';
    const url = pdf ? `https://drive.google.com/file/d/${item.id}/view`
                    : `https://docs.google.com/presentation/d/${item.id}/edit`;
    return `<div class="matcard reveal" data-mat-cat="${cat.id}">
      <div class="matcard-thumb">
        <img src="https://drive.google.com/thumbnail?id=${item.id}&sz=w400" alt="${esc(item.title)}"
          onerror="this.style.display='none';this.parentElement.style.background='var(--glass2)'">
        <span class="matcard-tag">${cat.ic} ${esc(cat.label)}</span>
      </div>
      <div class="matcard-body">
        <div class="matcard-t">${esc(item.title)}</div>
        <a class="matcard-btn" href="${url}" target="_blank" rel="noopener">${pdf?'Abrir PDF':'Abrir apresentação'} ↗</a>
      </div>
    </div>`;
  }).join('') || `<div class="note">Nenhum material nesta categoria.</div>`;
  initReveal();
}

  const dot    = e.target.closest('.tl-dot');
  const toCard = e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('.tl-card');
  const toDot  = e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('.tl-dot');
  if(dot && !toCard && !toDot){
    const card = dot.querySelector('.tl-card');
    if(card){ card.style.opacity=''; card.style.pointerEvents=''; }
  }
  const card = e.target.closest('.tl-card');
  if(card && !toDot && !toCard){ card.style.opacity=''; card.style.pointerEvents=''; }
});
</script>
</body>
</html>
